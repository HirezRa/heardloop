# Login/password attempts: 10 per minute per client IP (Argon2 is expensive; slows password spraying).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# Access log without query strings: OAuth codes, state values and search terms stay out of `docker logs`.
log_format noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /dev/stdout noquery;
  client_max_body_size 10m;
  client_body_timeout 300s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://media.licdn.com; media-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Every endpoint that checks a password or a second-factor code shares one limit.
  location ~ ^/api/v1/auth/(login|password|mfa/(verify|setup|enable|disable|recovery-codes))$ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Clearing the activity log re-checks the owner password: same zone, same limit.
  location ~ ^/api/v1/workspaces/[^/]+/audit/purge$ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Media uploads: one MP4 up to 200 MB, streamed straight to the API (no buffering to disk here).
  location ~ ^/api/v1/workspaces/[^/]+/media$ {
    client_max_body_size 210m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    # add_header in a location replaces the inherited set, so the server-level headers are repeated here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://media.licdn.com; media-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
