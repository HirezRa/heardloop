version: 2
updates:
  # One weekly PR per ecosystem for minor/patch; majors stay ungrouped (separate PRs).
  # react + react-dom (+ types) always move together.
  - package-ecosystem: uv
    directory: /src/backend
    schedule: { interval: weekly }
    groups:
      uv:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule: { interval: weekly }
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      npm:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: docker
    directories: [/src/backend, /src/frontend, /src/backup]
    schedule: { interval: weekly }
    groups:
      docker:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # Images named directly in the compose files (postgres for db).
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups:
      docker-compose:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        applies-to: version-updates
        update-types: ["minor", "patch"]
