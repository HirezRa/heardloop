name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context (optional)
      description: Screenshots, related issues, or constraints. No secrets or personal data.
