name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # this job can write; the release step gets its own token
      - name: Tag must match VERSION
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="$(tr -d '[:space:]' < VERSION)"
          test "$tag" = "v${ver}"
      - name: Extract changelog section
        run: python3 scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > /tmp/release-body.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Heardloop ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          make_latest: true
          generate_release_notes: false
