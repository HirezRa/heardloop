name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Personal / environment details
        run: python3 scripts/check_private.py --all
      - name: English-only
        run: python3 scripts/check_english.py --all
      - name: Version files agree
        run: python3 scripts/check_versions.py
      - name: Docs assets referenced
        run: python3 scripts/check_assets.py
      - name: Markdown relative links and anchors
        run: python3 scripts/check_md_links.py
      - name: Secrets (gitleaks, full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --redact --verbose

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: heardloop_test
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI database, no password needed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d heardloop_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ci@localhost:5432/heardloop_test
      TEST_DATABASE_URL: postgresql+asyncpg://ci@localhost:5432/heardloop_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Dependency audit (known vulnerabilities in runtime packages)
        # Any finding fails the job. Accepted exceptions go in .pip-audit-ignore (one advisory id per line).
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/req.txt
          ignore=""
          if [ -f "$GITHUB_WORKSPACE/.pip-audit-ignore" ]; then
            for id in $(sed 's/#.*//' "$GITHUB_WORKSPACE/.pip-audit-ignore" | awk 'NF{print $1}'); do
              ignore="$ignore --ignore-vuln $id"
            done
          fi
          uvx pip-audit@2.10.1 -r /tmp/req.txt --strict --disable-pip --no-deps $ignore
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations apply and match the models
        run: |
          export HEARDLOOP_TOKEN_KEY="$(python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')"
          echo "HEARDLOOP_TOKEN_KEY=$HEARDLOOP_TOKEN_KEY" >> "$GITHUB_ENV"
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q

  backup-smoke:
    # Builds src/backup and runs scripts/backup-smoke.sh against a throwaway PostgreSQL: backup, verify,
    # restore into a second database (plain and encrypted), failure manifest, retention, clean stop.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: heardloop_test
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI database, no password needed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d heardloop_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Backup and restore smoke test
        env:
          PGHOST: localhost
          DOCKER_NETWORK: host
        run: bash scripts/backup-smoke.sh

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:update-copy
      - run: npm run test:text-cut
      - run: npm run test:report-bars
      - run: npm run build
      - name: Install Chromium for smoke test
        # Pinned runner: on the ubuntu-latest image that moved to Ubuntu 26 this step (apt deps for the
        # browser) went from seconds to ~13 minutes. The timeout makes a repeat fail fast instead.
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Frontend smoke (login form mounts)
        run: npm run smoke
      - run: npm audit --audit-level=high

  stack-smoke:
    # Real docker compose images: health through the web port + login page. Catches
    # image/runtime breaks that unit tests and the static frontend smoke miss.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Full-stack compose smoke
        run: bash scripts/stack-smoke.sh

  installer-smoke:
    # Runs the real install.sh against the Actions checkout (keeps the PR/SHA version;
    # no --dir/--ref re-clone, which would break fork PRs). Builds the stack, checks
    # /api/v1/health, then runs the installer again for the re-run path.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer (first run)
        run: bash scripts/install.sh --yes --skip-docker --no-owner < /dev/null
      - name: Health through the installer web port
        run: |
          body="$(curl -fsS http://localhost:8380/api/v1/health)"
          echo "$body"
          echo "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'
      - name: Installer (re-run)
        run: bash scripts/install.sh --yes --skip-docker --no-owner < /dev/null
      - name: Health after re-run
        run: |
          body="$(curl -fsS http://localhost:8380/api/v1/health)"
          echo "$body"
          echo "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'

  installer-ps1-parse:
    # Parse-only: Windows PowerShell 5.1 and PowerShell 7 must accept install.ps1.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
          Write-Host 'PARSE_OK 5.1 scripts/install.ps1'
      - name: Parse install.ps1 (PowerShell 7)
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
          Write-Host 'PARSE_OK 7 scripts/install.ps1'
