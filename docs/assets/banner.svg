<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Heardloop - plan, approve, schedule and measure LinkedIn posts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a66c2"/>
      <stop offset="1" stop-color="#004182"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <circle cx="1130" cy="60" r="220" fill="url(#glow)"/>
    <circle cx="1210" cy="330" r="140" fill="#ffffff" fill-opacity="0.05"/>
  </g>
  <!-- loop icon -->
  <g transform="translate(96 108)">
    <circle cx="72" cy="72" r="60" fill="none" stroke="#ffffff" stroke-width="14"/>
    <rect x="104" y="0" width="44" height="44" fill="#0a5bb0"/>
    <path d="M100 18 L140 18 L120 46 Z" fill="#ffffff"/>
    <text x="72" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">H</text>
  </g>
  <text x="280" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff">Heardloop</text>
  <text x="282" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#e6f0fa">Plan, approve, schedule and measure your LinkedIn posts.</text>
  <text x="282" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#b9d3ee">Self-hosted · Docker · Two-step verification · English &amp; Hebrew (RTL)</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <g transform="translate(282 290)">
      <rect width="96" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/><text x="48" y="24" text-anchor="middle" fill="#ffffff">Write</text>
    </g>
    <g transform="translate(390 290)">
      <rect width="112" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/><text x="56" y="24" text-anchor="middle" fill="#ffffff">Approve</text>
    </g>
    <g transform="translate(514 290)">
      <rect width="118" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/><text x="59" y="24" text-anchor="middle" fill="#ffffff">Schedule</text>
    </g>
    <g transform="translate(644 290)">
      <rect width="106" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/><text x="53" y="24" text-anchor="middle" fill="#ffffff">Publish</text>
    </g>
    <g transform="translate(762 290)">
      <rect width="106" height="36" rx="18" fill="#ffffff" fill-opacity="0.32"/><text x="53" y="24" text-anchor="middle" fill="#ffffff">Learn ↺</text>
    </g>
  </g>
</svg>
